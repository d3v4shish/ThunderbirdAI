name: Validate bundle

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify manifest and repository portability
        run: python3 scripts/verify_bundle.py

      - name: Check helper syntax
        run: |
          python3 -m py_compile scripts/apply_bundle.py scripts/export_active.py scripts/verify_bundle.py
          bash -n scripts/apply.sh

      - name: Check whitespace errors
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD -- \
            '*.md' '*.py' '*.sh' '*.yml' '*.example' \
            ':(exclude)patches/**' ':(exclude)overlays/**'
